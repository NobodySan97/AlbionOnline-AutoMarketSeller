name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  release:
    types: [created, published]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tesseract via Chocolatey
        run: choco install tesseract-ocr --params "/NoAdmin" -y

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run Test Suite
        run: |
          python -m pytest

      - name: Build Portable Executable
        run: |
          python build_exe.py

      - name: Rename Executable with Tag / Version
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v2.0" }
          Copy-Item "dist/AutoMarketSeller.exe" "dist/AutoMarketSeller-$ver.exe"

      - name: Upload Release Asset
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AutoMarketSeller-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
