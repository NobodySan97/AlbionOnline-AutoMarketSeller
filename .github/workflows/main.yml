# Nome del workflow
name: Build Windows Executable

# Esegui quando viene creata una nuova "Release"
on:
  release:
    types: [created]

# Lavori da eseguire
jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Scarica il codice del tuo repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installa Tesseract (dipendenza esterna)
      - name: Install Tesseract
        run: choco install tesseract-ocr --params "/NoAdmin" -y

      # 3. Imposta Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. Installa le dipendenze Python
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # --- CORREZIONE QUI: Cerca il file nella root ---
          pip install -r requirements.txt
          pip install pyinstaller

      # 5. Esegui PyInstaller
      - name: Run PyInstaller
        run: |
          # --- CORREZIONE QUI: Cerca il file nella root ---
          pyinstaller --onefile --windowed --name "AutoMarketSeller-${{ github.ref_name }}" AutoSeller.py

      # 6. Carica l'eseguibile creato come asset della release
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./dist/AutoMarketSeller-${{ github.ref_name }}.exe
          asset_name: AutoMarketSeller-${{ github.ref_name }}.exe
          asset_content_type: application/octet-stream
